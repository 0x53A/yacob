[workspace]
resolver = "2"
members = ["common", "bootloader", "app"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
emdm-fwupdate-common = { path = "common" }
canopen-core = { path = "../../canopen-core", features = ["embassy", "defmt"] }
canopen-derive = { path = "../../canopen-derive" }

embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-futures = "0.1"
embassy-stm32 = { version = "0.6", features = [
    "stm32g431cb",
    "time-driver-tim15",
    "defmt",
] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
embedded-can = "0.4"
nb = "1.1"
static_cell = "2.1"

[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
opt-level = "s"
lto = true
