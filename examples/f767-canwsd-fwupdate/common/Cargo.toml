[package]
name = "f767-canwsd-fwupdate-common"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
crc.workspace = true

canopen-core = { workspace = true, optional = true }
canwsd-proto = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-net = { workspace = true, optional = true }
embassy-stm32 = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embedded-can = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
nb = { workspace = true, optional = true }
serde-json-core = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }

[features]
default = []
defmt = ["dep:defmt"]
hal = [
    "dep:canopen-core",
    "dep:canwsd-proto",
    "defmt",
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-net",
    "dep:embassy-stm32",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embedded-can",
    "dep:embedded-io-async",
    "dep:heapless",
    "dep:nb",
    "dep:serde-json-core",
    "dep:sha1",
]
