[package]
name = "emdm-fwupdate-common"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
crc = { version = "3", default-features = false }

# Only pulled in by the `hal` feature. Without it this crate is plain `core`,
# so the record format can be unit-tested on the host.
canopen-core = { path = "../../../canopen-core", features = [
    "embassy",
    "defmt",
], optional = true }
defmt = { version = "1", optional = true }
embassy-executor = { version = "0.10", optional = true }
embassy-stm32 = { version = "0.6", features = [
    "stm32g431cb",
    "time-driver-tim15",
    "defmt",
], optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-time = { version = "0.5", features = [
    "generic-queue-8",
], optional = true }
embedded-can = { version = "0.4", optional = true }
nb = { version = "1.1", optional = true }

[features]
default = []
defmt = ["dep:defmt"]
hal = [
    "dep:canopen-core",
    "defmt",
    "dep:embassy-executor",
    "dep:embassy-stm32",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embedded-can",
    "dep:nb",
]
